<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hazna</title>
<style>
  :root{
    --u:30px; --w:58px;
    --ivory:#F4EBD8; --beige:#E3D5B8; --beige-dk:#CDBC98;
    --bronze:#8C6A3F; --bronze-lt:#B58F55; --bronze-dk:#5C4526;
    --leather:#7A5636; --leather-lt:#9A7048; --leather-dk:#4E3521;
    --ink:#3A2E1E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:
      repeating-linear-gradient(90deg, rgba(140,106,63,.05) 0 1px, transparent 1px 3px),
      radial-gradient(120% 70% at 50% 0%, var(--ivory) 0%, var(--beige) 62%, var(--beige-dk) 100%);
  }

  header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 62px 9px 14px;color:var(--ivory);flex:0 0 auto;
    background:linear-gradient(180deg, var(--bronze-lt), var(--bronze) 55%, var(--bronze-dk));
    box-shadow:0 2px 8px rgba(60,40,15,.35);
  }
  .title{font-size:14px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
  .stats{font-size:13px;letter-spacing:.02em;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stats b{font-weight:700}
  #amulet{
    position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:9px;
    width:46px;height:auto;z-index:40;cursor:pointer;
    filter:drop-shadow(0 2px 5px rgba(40,26,8,.55));
    transition:transform .18s ease;
  }
  #amulet:active{transform:scale(.92)}
  #amulet.hidden{display:none}

  main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:6px}
  .shelf{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:18px 12px;margin:0 auto}
  .chests{display:flex;justify-content:center;align-items:flex-end;gap:30px}

  .sack{position:relative;width:var(--w);cursor:pointer;padding-top:11px;
        transition:transform .18s cubic-bezier(.4,1.4,.5,1)}
  .sack.sel{transform:translateY(-20px)}
  .cuff{
    position:absolute;top:0;left:-5px;right:-5px;height:15px;border-radius:7px 7px 3px 3px;
    background:linear-gradient(180deg, var(--leather-lt), var(--leather) 70%, var(--leather-dk));
    box-shadow:0 1px 2px rgba(50,32,15,.4), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .cuff::after{
    content:"";position:absolute;left:5px;right:5px;top:7px;height:2px;border-radius:2px;
    background:linear-gradient(90deg, var(--bronze-lt), #E2C489, var(--bronze));
    box-shadow:0 1px 1px rgba(0,0,0,.35);
  }
  .mouth{
    position:relative;height:calc(var(--cap) * var(--u) + 8px);padding:4px 3px 6px;
    border-left:5px solid var(--leather);border-right:5px solid var(--leather);
    border-bottom:6px solid var(--leather-dk);
    border-radius:2px 2px 26px 26px / 2px 2px 20px 20px;
    background:linear-gradient(180deg, rgba(78,53,33,.55), rgba(78,53,33,.28) 22%, rgba(78,53,33,.5));
    box-shadow:inset 0 3px 7px rgba(40,25,10,.6), 0 4px 8px rgba(80,58,28,.28);
    display:flex;flex-direction:column-reverse;justify-content:flex-start;overflow:hidden;
  }
  .sack.sel .mouth{box-shadow:inset 0 3px 7px rgba(40,25,10,.6), 0 0 0 2px var(--bronze-lt), 0 10px 16px rgba(80,58,28,.35)}
  .mouth::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(150deg, var(--leather-lt), var(--leather) 45%, var(--leather-dk));
    clip-path:inset(0 0 100% 0);
  }
  .sack.sealed .mouth::after{clip-path:inset(0 0 0 0)}
  .sack.sealing .mouth::after{animation:cover .34s ease-out both}
  @keyframes cover{from{clip-path:inset(0 0 100% 0)} to{clip-path:inset(0 0 0 0)}}

  .seal{
    position:absolute;left:50%;top:36%;width:calc(var(--w) * .46);height:calc(var(--w) * .46);
    margin-left:calc(var(--w) * -.23);
    border-radius:50%;display:none;place-items:center;z-index:2;
    background:radial-gradient(circle at 34% 30%, #D8B471, var(--bronze) 60%, var(--bronze-dk));
    box-shadow:0 2px 4px rgba(50,32,15,.5), inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .sack.sealed .seal{display:grid}
  .sack.sealing .seal{animation:stamp .28s .22s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes stamp{from{transform:scale(2.2) rotate(-14deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1}}
  .seal i{width:calc(var(--w) * .17);height:calc(var(--w) * .17);border-radius:50%;
          background:var(--sc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}

  .layer{height:var(--u);flex:0 0 var(--u);position:relative;display:flex;align-items:center;justify-content:center;gap:1px}
  .gem{position:relative;display:block;background:var(--c);
       box-shadow:inset 0 -2px 3px rgba(0,0,0,.45), inset 0 2px 2px rgba(255,255,255,.5), 0 1px 2px rgba(0,0,0,.4);
       outline:1px solid rgba(35,20,5,.55);outline-offset:-1px}
  .gem::after{content:"";position:absolute;left:16%;top:10%;width:30%;height:26%;border-radius:50%;
              background:rgba(255,255,255,.72);filter:blur(.4px)}
  .big{width:calc(var(--u) * .66);height:calc(var(--u) * .66)}
  .sml{width:calc(var(--u) * .40);height:calc(var(--u) * .40);opacity:.94}

  .g0{border-radius:50%}
  .g1{border-radius:50% / 62%}
  .g2{clip-path:polygon(50% 0,86% 50%,50% 100%,14% 50%)}
  .g3{border-radius:52% 52% 50% 50% / 72% 72% 42% 42%;transform:rotate(180deg)}
  .g4{clip-path:polygon(26% 0,74% 0,100% 26%,100% 74%,74% 100%,26% 100%,0 74%,0 26%)}
  .g5{border-radius:50% 50% 34% 34% / 62% 62% 38% 38%}
  .g6{border-radius:2px;height:calc(var(--u) * .46) !important}
  .g6.sml{height:calc(var(--u) * .28) !important}
  .g7{clip-path:polygon(50% 4%,96% 88%,4% 88%)}
  .g8{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .g9{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .g10{clip-path:polygon(50% 2%,62% 36%,97% 36%,69% 58%,80% 94%,50% 72%,20% 94%,31% 58%,3% 36%,38% 36%)}
  .g11{clip-path:polygon(36% 0,64% 0,64% 36%,100% 36%,100% 64%,64% 64%,64% 100%,36% 100%,36% 64%,0 64%,0 36%,36% 36%)}

  .fly{position:fixed;width:20px;height:20px;pointer-events:none;z-index:9;
       box-shadow:inset 0 -2px 3px rgba(0,0,0,.4), 0 2px 5px rgba(0,0,0,.35);outline:1px solid rgba(35,20,5,.5)}

  footer{flex:0 0 auto;display:flex;gap:10px;justify-content:center;padding:10px 14px 16px;
         flex-wrap:wrap;max-width:430px;margin:0 auto;width:100%}
  button{
    font:inherit;font-size:16px;font-weight:600;color:var(--ivory);
    background:linear-gradient(180deg, var(--bronze-lt), var(--bronze));
    border:1px solid var(--bronze-dk);border-radius:9px;padding:14px 18px;cursor:pointer;
    box-shadow:0 2px 4px rgba(70,48,20,.3), inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .1s, filter .15s;
  }
  footer button{flex:1 1 40%;min-width:calc(50% - 22px);max-width:200px}
  button:active{transform:translateY(1px) scale(.98)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid var(--bronze-dk);outline-offset:2px}

  .veil{position:fixed;inset:0;background:rgba(60,44,22,.55);backdrop-filter:blur(3px);
        display:flex;align-items:center;justify-content:center;padding:18px;z-index:10;
        opacity:0;pointer-events:none;transition:opacity .25s;overflow:auto}
  .veil.on{opacity:1;pointer-events:auto}
  .card{
    background:linear-gradient(180deg, var(--ivory), var(--beige));
    border:2px solid var(--bronze);border-radius:6px;
    box-shadow:0 12px 30px rgba(50,34,14,.45);
    padding:26px 20px 18px;max-width:380px;width:100%;text-align:center;margin:auto;
  }
  .card h2{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:.02em;color:var(--bronze-dk)}
  .card .sub{margin:0 0 14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
  .card .quote{margin:0 0 16px;font-size:16.5px;line-height:1.5;font-style:italic;opacity:.88}
  .card .count{margin:0 0 18px;font-size:12.5px;letter-spacing:.06em;opacity:.6;text-transform:uppercase}
  .card .tale{margin:0 0 18px;font-size:14.5px;line-height:1.55;text-align:left}
  .card .tale p{margin:0 0 9px}
  .cover{width:100%;max-width:300px;border:2px solid var(--bronze);border-radius:4px;
         display:block;margin:0 auto 14px;box-shadow:0 6px 16px rgba(50,34,14,.35)}

  .splash{position:fixed;inset:0;z-index:20;background:#000;
          display:flex;align-items:center;justify-content:center;
          opacity:0;pointer-events:none;transition:opacity .4s}
  .splash.on{opacity:1;pointer-events:auto}
  .splash img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  #splash .plate{
    position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);
    text-align:center;pointer-events:none;
    text-shadow:0 2px 10px rgba(0,0,0,.9), 0 0 26px rgba(0,0,0,.75);
  }
  #splash .name{
    font-size:38px;font-weight:800;letter-spacing:.30em;text-transform:uppercase;
    color:#E7C88B;margin:0 0 6px;padding-left:.30em;
  }
  #splash .tag{font-size:12.5px;letter-spacing:.20em;text-transform:uppercase;color:#F4EBD8;opacity:.72;margin:0}
  .card .row + button{width:100%}
  .menugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 4px}
  .menugrid button{min-width:0;width:100%;min-height:62px;padding:10px 8px;font-size:15px;
                   display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
  .menugrid button small{display:block;font-size:11.5px;font-weight:600;opacity:.75;letter-spacing:.04em;margin-top:3px}
  .doc{text-align:left;font-size:13.5px;line-height:1.55;margin:0 0 16px;max-height:56vh;overflow:auto}
  .doc h3{margin:14px 0 4px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.5;font-weight:700}
  .doc p{margin:0 0 7px}
  .doc a{color:var(--bronze-dk);text-decoration:underline}
  .doc .ver{opacity:.45;font-size:12px;margin-top:12px}
  .flags{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
  .flags button{font-size:22px;padding:10px 0;min-width:0;background:rgba(140,106,63,.14);
                border-color:rgba(92,69,38,.35);box-shadow:none}
  .flags button.on{background:linear-gradient(180deg, var(--bronze-lt), var(--bronze));
                   box-shadow:0 2px 4px rgba(70,48,20,.3)}
  .row{display:flex;gap:10px;margin:0 0 12px}
  .row button{flex:1;min-width:0}
  .lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.5;text-align:left;margin:0 0 7px}
  .tally{font-size:13px;opacity:.66;text-align:left;line-height:1.6;margin:0 0 16px}
  .about{font-size:12.5px;line-height:1.5;opacity:.55;text-align:left;margin:14px 0 0;
         border-top:1px solid rgba(92,69,38,.25);padding-top:12px}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<img id="amulet" src="amulet.png" alt="">

<header>
  <div class="title">Hazna</div>
  <div class="stats"><span id="lvlLbl">audit</span> <b id="lvl">1</b> · <span id="mvLbl">moves</span> <b id="mv">0</b></div>
</header>

<main>
  <div class="shelf" id="shelf"></div>
  <div class="chests" id="chests"></div>
</main>

<footer>
  <button id="undo">Undo</button>
  <button id="reset">Restart</button>
  <button id="hint">Hint</button>
  <button id="auto">Solve</button>
</footer>

<div class="splash on" id="splash">
  <img id="splashImg" src="cover.jpg" alt="">
  <div class="plate">
    <p class="name" id="splashName">HAZNA</p>
    <p class="tag" id="splashTag"></p>
  </div>
</div>

<div class="veil" id="menu">
  <div class="card">
    <h2>Hazna</h2>
    <p class="sub" id="menuSub"></p>
    <div class="tale" id="descText"></div>
    <div class="menugrid">
      <button id="playBtn"></button>
      <button id="menuFresh"></button>
      <button id="menuSound"></button>
      <button id="menuLang"></button>
    </div>
    <p class="about" id="aboutMenu"></p>
  </div>
</div>

<div class="splash" id="artSplash"><img id="artImg" src="" alt=""></div>

<div class="veil" id="veil">
  <div class="card">
    <h2 id="veilTitle"></h2>
    <p class="quote" id="veilQuote"></p>
    <p class="count" id="veilCount"></p>
    <button class="primary" id="next"></button>
  </div>
</div>

<div class="veil" id="setup">
  <div class="card">
    <h2 id="setupTitle"></h2>
    <p class="lbl" id="langLbl"></p>
    <div class="flags" id="flags"></div>
    <div class="menugrid">
      <button id="soundBtn"></button>
      <button id="freshBtn"></button>
      <button id="rulesBtn"></button>
      <button id="aboutBtn"></button>
    </div>
    <div class="menugrid">
      <button id="closeSetup" style="grid-column:1 / -1"></button>
    </div>
    <p class="tally" id="tally"></p>
  </div>
</div>

<div class="veil" id="about">
  <div class="card">
    <h2 id="aboutTitle"></h2>
    <div class="doc" id="aboutBody"></div>
    <button id="closeAbout"></button>
  </div>
</div>

const L = {};

L.en = {
  rules:"Rules", hard:"strict", soft:"forgiving",

  levelLbl:"audit", movesLbl:"moves",
  undo:"Undo", reset:"Restart", hint:"Hint", solve:"Solve", stop:"Stop", rewinding:"Rewinding…",
  noWay:"It doesn't add up",

  title: "About Hazna",
  body: `<p>A sorting puzzle in a treasury. Each kind of gem goes into its own sack, filled to the brim, drawstring pulled tight. Code, design and logic fully generated by AI, with no human involvement.</p>

<h3>Under the hood</h3>
<p>Levels: dealt by unwinding a sealed treasury with reversible moves, so every deal is solvable by construction — no unwinnable boards.</p>
<p>Hint and Solve: a priority search with an estimate of the work left. In a dead end it rewinds to the last position where the treasury still added up, then plays on.</p>
<p>Sound: synthesised on the fly by the Web Audio API. No audio files.</p>
<p>Progress: level, chests sealed and total moves are kept on the device. The board itself is not saved.</p>

<h3>Screens</h3>
<p>Tap a sack to lift it, tap another to pour. A full sack seals itself.</p>

      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.23);
    }
  }catch(e){}
}

/* ---------- состояние партии ---------- */
let state = null;
let level = 1, moves = 0, selected = -1, history = [], prevSealed = new Set(), autoTimer = null;
let opened = new Set();   // мешки, с которых сорвали пломбу (только в мягких правилах)
let hardMode = true;      // строгие правила: пломба окончательна
/* ---------- модель, солвер, генератор ---------- */

function topGroup(b){
  if (!b.length) return null;
  const c = b[b.length-1];
  let n = 1;
  for (let i=b.length-2;i>=0 && b[i]===c;i--) n++;
  return {color:c, count:n};
}
/* strict=true — правила поиска: солвер не тратит время на переезды с места на место.
   strict=false — правила игрока: переложить можно всё, что физически влезает. */
function canPour(bots, caps, i, j, strict){
  if (i===j) return 0;
  const src = bots[i], dst = bots[j];
  if (!src.length) return 0;
  if (hardMode && isSealed(src, caps[i])) return 0;   // строгие правила: пломба окончательна
  const free = caps[j] - dst.length;
  if (free <= 0) return 0;
  const g = topGroup(src);
  if (dst.length && dst[dst.length-1] !== g.color) return 0;
  if (strict && !dst.length && g.count === src.length && caps[i] === caps[j]) return 0;
  return Math.min(g.count, free);
}
function applyPour(bots, i, j, n){
  const c = bots[i][bots[i].length-1];
  for (let k=0;k<n;k++){ bots[i].pop(); bots[j].push(c); }
}
/* Полный однородный мешок затягивается сам — но эту пломбу можно сорвать тапом.
   Окончательна лишь та, где собран весь вид целиком: срывать её незачем. */
function isSealed(b, cap){
  if (!b.length || b.length !== cap) return false;
  const c = b[0];
  for (const x of b) if (x !== c) return false;
  return true;
}
function isFinal(b, cap, totals){
  return isSealed(b, cap) && (!totals || b.length === totals[b[0]]);
}
/* Ревизия закончена только когда каждый непустой мешок полон, однороден и опечатан.
   Ларь на шесть мест опечатать нельзя — он рабочее место, к концу должен быть пуст. */
function solved(bots, colors, caps){
  const used = new Set();
  for (let i=0;i<bots.length;i++){
    const b = bots[i];
    if (!b.length) continue;
    if (b.length !== caps[i]) return false;
    const c = b[0];
    for (const x of b) if (x !== c) return false;
    if (used.has(c)) return false;
    used.add(c);
  }
  return used.size === colors;
}
function key(bots, caps){ return bots.map((b,i)=>caps[i]+":"+b.join(",")).sort().join("|"); }

/* ---------- солвер ---------- */
/* Поиск по приоритету: сначала разбираются позиции, до порядка которым ближе.
   Оценка остатка — число разрывов в мешках плюс раскиданность видов. */
function Heap(){ this.a = []; }
Heap.prototype.push = function(x){
  const a=this.a; a.push(x); let i=a.length-1;
  while(i>0){ const p=(i-1)>>1; if(a[p].f<=a[i].f) break; const t=a[p]; a[p]=a[i]; a[i]=t; i=p; }
};
Heap.prototype.pop = function(){
  const a=this.a, top=a[0], last=a.pop();
  if(a.length){ a[0]=last; let i=0;
    for(;;){ const l=2*i+1, r=l+1; let m=i;
      if(l<a.length&&a[l].f<a[m].f) m=l;
      if(r<a.length&&a[r].f<a[m].f) m=r;
      if(m===i) break; const t=a[m]; a[m]=a[i]; a[i]=t; i=m; }
  }
  return top;
};
Heap.prototype.size = function(){ return this.a.length; };

function remaining(b){
  let h = 0;
  const spread = new Map();
  for (const bag of b){
    if (!bag.length) continue;
    let groups = 1;
    for (let k=1;k<bag.length;k++) if (bag[k] !== bag[k-1]) groups++;
    h += groups - 1;
    const seenHere = new Set(bag);
    seenHere.forEach(c => spread.set(c, (spread.get(c)||0) + 1));
  }
  spread.forEach(v => { h += v - 1; });
  return h;
}

let SOLVE_TOTALS = null;
function totalsFor(c){ return SOLVE_TOTALS ? SOLVE_TOTALS[c] : Infinity; }

function solve(bots0, caps, colors, nodeLimit, totals){
  SOLVE_TOTALS = totals || null;
  const start = bots0.map(x=>x.slice());
  const heap = new Heap();
  const seen = new Set([key(start, caps)]);
  heap.push({b:start, g:0, f:remaining(start)*2, parent:null, move:null});
  let nodes = 0;

  while (heap.size()){
    const cur = heap.pop();
    if (++nodes > nodeLimit) return null;
    if (solved(cur.b, colors, caps)){
      const path = [];
      let n = cur;
      while (n.move){ path.push(n.move); n = n.parent; }
      return path.reverse();
    }
    const b = cur.b;
    const list = [], merges = [];
    for (let i=0;i<b.length;i++){
      const g = topGroup(b[i]);
      if (!g) continue;
      for (let j=0;j<b.length;j++){
        const n = canPour(b, caps, i, j, true);
        if (!n) continue;
        // при строгих правилах ход, запирающий мешок не на всех камнях вида, — ловушка:
        // достать оттуда уже нельзя, значит к победе он привести не может
        if (hardMode && b[j].length + n === caps[j]
            && b[j].every(x => x === g.color)                 // мешок станет однородным, то есть опечатается
            && b[j].length + n !== totalsFor(g.color)) continue;   // но вид собран не весь — ловушка
        const m = {i,j,n};
        list.push(m);
        if (b[j].length && n === g.count) merges.push(m);   // горсть уходит к своим целиком
      }
    }
    // при строгих правилах доминирующее правило теряет полноту: слияние может отрезать
    // единственный путь, поэтому там перебираем все ходы
    const moves = (!hardMode && merges.length) ? merges : list;
    for (const m of moves){
      const nb = b.map(x=>x.slice());
      applyPour(nb, m.i, m.j, m.n);
      const k = key(nb, caps);
      if (seen.has(k)) continue;
      seen.add(k);
      heap.push({b:nb, g:cur.g+1, f:cur.g+1+remaining(nb)*2, parent:cur, move:[m.i,m.j]});
    }
  }
  return null;
}

/* ---------- генератор ---------- */
/* Добыча и тара считаются вместе: сколько камней вида, столько мест в его мешке.
   Ларь на одно место больше самого крупного мешка — опечатать его нельзя никогда.
   Раздача строится обратным ходом из опечатанной казны: каждый шаг обратим,
   значит путь назад существует всегда. Солвер при раздаче не нужен. */
function rnd(lo, hi){ return lo + Math.floor(Math.random()*(hi-lo+1)); }
function shuffle(a){
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function levelPlan(n){
  // на маленьком экране казна беднее — иначе мешки пришлось бы мельчить
  const room = (typeof window !== "undefined" && window.innerHeight) ? window.innerHeight : 700;
  const ceiling = room >= 780 ? MAX_GEMS : (room >= 660 ? 10 : 8);
  const base = Math.min(4 + Math.floor((n-1)/2), ceiling);
  const colors = Math.max(3, Math.min(ceiling, base + [-1,0,0,1][rnd(0,3)]));
  let lo = 3, hi = 4;
  if (n >= 5) hi = 5;
  if (n >= 9) hi = 6;
  if (n >= 13) lo = 4;
  const counts = [];
  for (let i=0;i<colors;i++) counts.push(rnd(lo, hi));
  shuffle(counts);
  const chestCap = Math.max.apply(null, counts) + 1;
  const chestN = colors <= 6 ? 1 : 2;
  return {colors, counts, chestCap, chestN};
}

/* один обратный шаг: снять k верхних камней одного вида и положить туда,
   откуда прямой ход вернёт ровно их же */
function unmove(bots, caps){
  const from = [];
  for (let i=0;i<bots.length;i++) if (bots[i].length) from.push(i);
  shuffle(from);
  for (const i of from){
    const g = topGroup(bots[i]);
    const maxK = (g.count === bots[i].length) ? g.count : g.count - 1;  // либо опустошаем, либо оставляем свой вид сверху
    if (maxK < 1) continue;
    const k = rnd(1, maxK);
    const to = [];
    for (let j=0;j<bots.length;j++){
      if (j === i) continue;
      if (caps[j] - bots[j].length < k) continue;
      if (bots[j].length && bots[j][bots[j].length-1] === g.color) continue;  // иначе горсти слипнутся
      to.push(j);
    }
    if (!to.length) continue;
    // прямой ход пойдёт из j обратно в i: значит после укладки мешок j не должен оказаться
    // полным и однородным, иначе при строгих правилах он опечатается и путь назад пропадёт
    const safe = to.filter(j => !(bots[j].length + k === caps[j] && bots[j].every(x => x === g.color)));
    if (!safe.length) continue;
    const j = safe[rnd(0, safe.length-1)];
    for (let t=0;t<k;t++){ bots[i].pop(); bots[j].push(g.color); }
    return true;
  }
  return false;
}

function buildLevel(n){
  const {colors, counts, chestCap, chestN} = levelPlan(n);
  const caps = counts.slice();
  const chest = caps.map(()=>false);
  for (let i=0;i<chestN;i++){ caps.push(chestCap); chest.push(true); }

  let best = null, bestMess = -1;
  for (let attempt=0; attempt<12; attempt++){
    const bots = caps.map(()=>[]);
    for (let c=0;c<colors;c++) for (let k=0;k<counts[c];k++) bots[c].push(c);
    const steps = colors * 14 + 30;
    for (let s=0;s<steps;s++) if (!unmove(bots, caps)) break;

    let sealedAtStart = 0;
    bots.forEach((b,i)=>{ if (isSealed(b, caps[i])) sealedAtStart++; });
    const mess = remaining(bots) - sealedAtStart*4;
    if (mess > bestMess){ bestMess = mess; best = bots; }
    if (!sealedAtStart && mess >= colors + 4) return {caps, chest, bots, colors, totals:counts.slice()};
  }
  return {caps, chest, bots: best, colors, totals:counts.slice()};
}

/* ---------- отрисовка ---------- */
const shelf = document.getElementById("shelf");
const chests = document.getElementById("chests");
const $ = id => document.getElementById(id);

function rowsFor(caps, perRow){
  const rows = [];
  for (let i=0;i<caps.length;i+=perRow) rows.push(caps.slice(i, i+perRow));
  return rows;
}

function fitSizes(){
  const ordered = state.order.map(i => state.caps[i]);
  const chestCaps = state.chestOrder.map(i => state.caps[i]);
  const maxChest = chestCaps.length ? Math.max.apply(null, chestCaps) : 0;
  const head = document.querySelector("header").offsetHeight;
  const foot = document.querySelector("footer").offsetHeight;
  const availH = window.innerHeight - head - foot - 18;
  const availW = Math.min(window.innerWidth, 520) - 14;
  const ROW_PAD = 24;

  let best = null;
  for (let pr = 3; pr <= 6; pr++){
    if (pr > ordered.length && pr > 3) break;
    const w = Math.floor(availW / pr) - 12;
    if (w < 40) continue;
    const rows = rowsFor(ordered, pr);
    const units = rows.reduce((sum, r) => sum + Math.max.apply(null, r), 0) + maxChest;
    const rowCount = rows.length + (chestCaps.length ? 1 : 0);
    let u = Math.floor((availH - rowCount * ROW_PAD) / Math.max(1, units));
    u = Math.min(u, Math.floor((w - 18) / 1.5), 46);
    if (!best || u > best.u) best = {u, w: Math.min(w, 92), perRow: pr};
  }
  if (!best) best = {u:15, w:44, perRow:4};
  best.u = Math.max(best.u, 14);
  document.documentElement.style.setProperty("--u", best.u+"px");
  document.documentElement.style.setProperty("--w", best.w+"px");
  shelf.style.maxWidth = (best.perRow * (best.w + 12)) + "px";
}

function gemEl(idx, cls){
  const g = document.createElement("span");
  g.className = "gem " + cls + " g" + GEMS[idx].g;
  g.style.setProperty("--c", GEMS[idx].c);
  return g;
}

function render(){
  shelf.innerHTML = ""; chests.innerHTML = "";
  const nowSealed = new Set();
  state.order.concat(state.chestOrder).forEach(idx => {
    const b = state.bots[idx], cap = state.caps[idx];
    const shut = isSealed(b, cap) && (hardMode || !opened.has(idx));
    if (shut) nowSealed.add(idx);

    const el = document.createElement("div");
    el.className = "sack" + (idx===selected ? " sel" : "") + (shut ? " sealed" : "");
    if (shut && !prevSealed.has(idx)) { el.classList.add("sealing"); beep("seal"); }
    el.dataset.i = idx;
    el.style.setProperty("--cap", cap);

    const cuff = document.createElement("div"); cuff.className = "cuff";
    const mouth = document.createElement("div"); mouth.className = "mouth";
    b.forEach(c => {
      const layer = document.createElement("div");
      layer.className = "layer";
      layer.appendChild(gemEl(c, "sml"));
      layer.appendChild(gemEl(c, "big"));
      layer.appendChild(gemEl(c, "sml"));
      mouth.appendChild(layer);
    });
    const seal = document.createElement("div"); seal.className = "seal";
    if (b.length){ const dot = document.createElement("i"); dot.style.setProperty("--sc", GEMS[b[0]].c); seal.appendChild(dot); }

    el.appendChild(cuff); el.appendChild(mouth); el.appendChild(seal);
    (state.chest[idx] ? chests : shelf).appendChild(el);
  });
  prevSealed = nowSealed;
  $("lvl").textContent = level;
  $("mv").textContent = moves;
  $("undo").disabled = autoTimer !== null || history.length === 0;
}

function flyGem(fromEl, toEl, gi){
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "fly g" + GEMS[gi].g;
  d.style.background = GEMS[gi].c;
  d.style.left = (a.left + a.width/2 - 10) + "px";
  d.style.top = (a.top - 2) + "px";
  document.body.appendChild(d);
  const dx = (b.left + b.width/2) - (a.left + a.width/2);
  const dy = (b.top - 2) - (a.top - 2);
  d.animate(
    [{transform:"translate(0,0) rotate(0deg)"},
     {transform:"translate("+(dx*0.5)+"px,"+(Math.min(dy,0)-32)+"px) rotate(160deg)", offset:.5},
     {transform:"translate("+dx+"px,"+dy+"px) rotate(320deg)", opacity:.3}],
    {duration:280, easing:"cubic-bezier(.4,.1,.6,1)"}
  ).onfinish = () => d.remove();
}

/* ---------- ход ---------- */
function sackEl(i){ return document.querySelector('.sack[data-i="'+i+'"]'); }

function doMove(i, j, n){
  const gi = state.bots[i][state.bots[i].length-1];
  const from = sackEl(i), to = sackEl(j);
  if (from && to) flyGem(from, to, gi);
  beep("drop");
  history.push({bots: state.bots.map(x=>x.slice()), moves, opened: Array.from(opened)});
  opened.delete(i); opened.delete(j);
  applyPour(state.bots, i, j, n);
  moves++; selected = -1;
  render();
  return solved(state.bots, state.colors, state.caps);
}

function tap(i){
  if (autoTimer) return;
  if (isSealed(state.bots[i], state.caps[i]) && (hardMode || !opened.has(i))){
    if (hardMode) return;                // строгие правила: опечатанный мешок не трогают
    opened.add(i);                       // мягкие: пломбу сорвали, мешок снова в работе
    selected = i;
    beep("back");
    render();
    return;
  }
  if (selected === -1){
    if (!state.bots[i].length) return;
    selected = i; render(); return;
  }
  if (selected === i){ selected = -1; render(); return; }
  const n = canPour(state.bots, state.caps, selected, i, false);
  if (!n){ selected = state.bots[i].length ? i : -1; render(); return; }
  if (doMove(selected, i, n)) setTimeout(win, 620);
}

document.addEventListener("click", e => {
  const el = e.target.closest(".sack");
  if (el) tap(parseInt(el.dataset.i, 10));
});

/* ---------- разбор за игрока ---------- */
function stopAuto(){
  if (autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
  $("auto").textContent = T.solve;
  ["undo","reset","hint"].forEach(id => $(id).disabled = false);
  $("undo").disabled = history.length === 0;
}
function bagsAt(k){ return k < history.length ? history[k].bots : state.bots; }
function lastSolvable(){
  let lo = 0, hi = history.length, best = null;
  const p0 = solve(bagsAt(0).map(x=>x.slice()), state.caps, state.colors, 60000, state.totals);
  if (!p0) return null;
  best = {index:0, path:p0};
  while (lo + 1 < hi){
    const mid = (lo + hi) >> 1;
    const p = solve(bagsAt(mid).map(x=>x.slice()), state.caps, state.colors, 60000, state.totals);
    if (p){ lo = mid; best = {index:mid, path:p}; } else hi = mid;
  }
  return best;
}
function playPath(path){
  $("auto").textContent = T.stop;
  let k = 0;
  const step = () => {
    if (k >= path.length){ stopAuto(); return; }
    const [i,j] = path[k++];
    const n = canPour(state.bots, state.caps, i, j, false);
    if (!n){ stopAuto(); return; }
    if (doMove(i, j, n)){ autoTimer = null; stopAuto(); setTimeout(win, 620); return; }
    autoTimer = setTimeout(step, 430);
  };
  autoTimer = setTimeout(step, 140);
}
function rewindTo(target, then){
  $("auto").textContent = T.rewinding;
  const step = () => {
    if (history.length <= target){ autoTimer = null; then(); return; }
    const h = history.pop();
    state.bots = h.bots; moves = h.moves; selected = -1;
    opened = new Set(h.opened || []);
    prevSealed = new Set();
    state.bots.forEach((b,i)=>{ if (isSealed(b, state.caps[i]) && !opened.has(i)) prevSealed.add(i); });
    beep("back"); render();
    autoTimer = setTimeout(step, 260);
  };
  autoTimer = setTimeout(step, 140);
}

/* ---------- кнопки ---------- */
$("undo").onclick = () => {
  if (autoTimer) return;
  const h = history.pop();
  if (!h) return;
  state.bots = h.bots; moves = h.moves; selected = -1;
  opened = new Set(h.opened || []);
  prevSealed = new Set();
  state.bots.forEach((b,i)=>{ if (isSealed(b, state.caps[i]) && !opened.has(i)) prevSealed.add(i); });
  render();
};
$("reset").onclick = () => { stopAuto(); startLevel(level); };
$("hint").onclick = () => {
  if (autoTimer) return;
  const btn = $("hint");
  const path = solve(state.bots.map(x=>x.slice()), state.caps, state.colors, 40000, state.totals);
  if (!path || !path.length){
    btn.textContent = T.noWay;
    setTimeout(()=>btn.textContent = T.hint, 1800);
    return;
  }
  const [i,j] = path[0];
  sackEl(i).classList.add("sel");
  setTimeout(()=>{ const e=sackEl(j); if(e) e.classList.add("sel"); }, 220);
  setTimeout(render, 1100);
};
$("auto").onclick = () => {
  const btn = $("auto");
  if (autoTimer){ stopAuto(); return; }
  ["undo","reset","hint"].forEach(id => $(id).disabled = true);
  selected = -1;
  const path = solve(state.bots.map(x=>x.slice()), state.caps, state.colors, 60000, state.totals);
  if (path && path.length){ playPath(path); return; }
  const back = lastSolvable();
  if (!back){
    btn.textContent = T.noWay;
    setTimeout(stopAuto, 1800);
    return;
  }
  rewindTo(back.index, () => playPath(back.path));
};

/* ---------- уровни ---------- */
function startLevel(n){
  if (autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
  level = n; moves = 0; selected = -1; history = []; prevSealed = new Set(); opened = new Set();
  state = buildLevel(n);
  state.order = state.caps.map((c,i)=>i).filter(i=>!state.chest[i])
                          .sort((a,b)=>state.caps[b]-state.caps[a]);
  state.chestOrder = state.caps.map((c,i)=>i).filter(i=>state.chest[i]);
  state.bots.forEach((b,i)=>{ if (isSealed(b, state.caps[i])) prevSealed.add(i); });
  $("veil").classList.remove("on");
  stopAuto();
  render(); fitSizes(); render();
}

function win(){
  const royal = (level % 10 === 0);
  $("veilTitle").textContent = royal ? T.royal : T.sealed;
  $("veilQuote").textContent = royal ? "\u00AB" + PADISHAH[(level/10 - 1) % PADISHAH.length] + "\u00BB" : "";
  $("veilQuote").style.display = royal ? "" : "none";
  $("veilCount").textContent = T.levelLbl + " " + level + " · " + T.movesLbl + " " + moves;
  $("next").textContent = T.next;
  $("veil").classList.add("on");
  save.level = level + 1;
  save.sealed = (save.sealed || 0) + 1;
  save.total = (save.total || 0) + moves;
  writeSave();
}
const ART_COUNT = 10;                 // рисунки лежат в art/01.jpg … art/10.jpg
/* Колода: за десять заставок каждая картина выпадет ровно раз, порядок случайный,
   и подряд одна и та же не повторяется. */
let artDeck = [];
function nextArt(){
  if (!artDeck.length){
    const last = save.lastArt;
    for (let i=1;i<=ART_COUNT;i++) artDeck.push(i);
    for (let i=artDeck.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t = artDeck[i]; artDeck[i] = artDeck[j]; artDeck[j] = t;
    }
    if (artDeck.length > 1 && artDeck[artDeck.length-1] === last){
      const t = artDeck[artDeck.length-1];
      artDeck[artDeck.length-1] = artDeck[0]; artDeck[0] = t;
    }
  }
  const n = artDeck.pop();
  save.lastArt = n; writeSave();
  return n;
}
function showArt(then){
  const n = nextArt();
  const box = $("artSplash"), img = $("artImg");
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    box.classList.remove("on");
    box.onclick = null;
    then();
  };
  img.onerror = () => { img.onerror = null; finish(); };   // нет файла — идём дальше без паузы
  img.src = "art/" + (n < 10 ? "0" + n : n) + ".jpg";
  box.classList.add("on");
  box.onclick = finish;
  setTimeout(finish, 5000);
}
$("next").onclick = () => {
  const done = level;
  $("veil").classList.remove("on");
  if (done % 30 === 0) showArt(() => startLevel(done + 1));
  else startLevel(done + 1);
};
window.addEventListener("resize", () => { if (state){ fitSizes(); render(); } });

  $("lvlLbl").textContent = T.levelLbl;
  $("mvLbl").textContent = T.movesLbl;

  $("auto").textContent = T.solve;
  $("menuSub").textContent = T.sub;
  $("splashTag").textContent = T.sub;

  $("playBtn").innerHTML = save.level > 1
      ? T.play + "<small>" + T.levelLbl + " " + save.level + "</small>"
      : T.playNew;
  $("menuSound").textContent = T.sound + ": " + (audioOn ? T.on : T.off);

  $("menuLang").textContent = T.language;
  $("aboutMenu").textContent = T.about;
  $("aboutBtn").textContent = T.aboutBtn;
  $("rulesBtn").textContent = T.rules + ": " + (hardMode ? T.hard : T.soft);
  $("aboutTitle").textContent = docFor(document.documentElement.lang).title;
  $("aboutBody").innerHTML = docFor(document.documentElement.lang).body;
  $("closeAbout").textContent = T.close;
  $("setupTitle").textContent = T.settings;
  $("langLbl").textContent = T.language;
  $("soundBtn").textContent = T.sound + ": " + (audioOn ? T.on : T.off);
  $("freshBtn").textContent = T.fresh;
  $("closeSetup").textContent = T.close;

}

/* ---------- настройки ---------- */
function buildFlags(){
  const box = $("flags");
  box.innerHTML = "";
  LANGS.forEach(l => {
    const b = document.createElement("button");
    b.textContent = l.flag;
    if (l.code === langPref) b.classList.add("on");
    b.onclick = () => {
      langPref = l.code; save.lang = l.code; writeSave();
      applyLang(); buildFlags();
    };
    box.appendChild(b);
  });
}
function openSetup(){ applyLang(); buildFlags(); $("setup").classList.add("on"); }
$("amulet").onclick = e => { e.stopPropagation(); openSetup(); };
$("amulet").onerror = () => { $("amulet").classList.add("hidden"); };
$("closeSetup").onclick = () => $("setup").classList.remove("on");
$("aboutBtn").onclick = () => { $("about").classList.add("on"); };
$("rulesBtn").onclick = () => {
  hardMode = !hardMode; save.hard = hardMode; writeSave();
  $("rulesBtn").textContent = T.rules + ": " + (hardMode ? T.hard : T.soft);
  beep("drop");
  startLevel(level);                     // правила сменились — ревизия начинается заново
};
$("closeAbout").onclick = () => $("about").classList.remove("on");
function toggleSound(){
  audioOn = !audioOn; save.sound = audioOn; writeSave();
  const label = T.sound + ": " + (audioOn ? T.on : T.off);
  $("soundBtn").textContent = label;
  $("menuSound").textContent = label;
  if (audioOn) beep("drop");
}
$("soundBtn").onclick = toggleSound;
$("menuSound").onclick = toggleSound;
function armFresh(btn){
  if (btn.dataset.armed){
    save.level = 1; save.sealed = 0; save.total = 0;
    writeSave();
    delete btn.dataset.armed;
    $("setup").classList.remove("on");
    $("menu").classList.remove("on");
    $("veil").classList.remove("on");
    applyLang();
    startLevel(1);
    return;
  }
  btn.dataset.armed = "1";
  btn.textContent = T.freshAsk;
  setTimeout(()=>{ if (btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = T.fresh; } }, 4000);
}
$("freshBtn").onclick = () => armFresh($("freshBtn"));
$("menuFresh").onclick = () => armFresh($("menuFresh"));
$("menuLang").onclick = openSetup;

/* ---------- запуск ---------- */
(async function boot(){
  const splash = $("splash");
  let shown = false;
  const leaveSplash = () => {
    if (shown) return;
    shown = true;
    splash.classList.remove("on");
    setTimeout(()=>{ splash.style.display = "none"; }, 400);
    $("menu").classList.add("on");
  };
  splash.onclick = leaveSplash;
  $("splashImg").onerror = leaveSplash;
  setTimeout(leaveSplash, 5000);          // ставим до всего прочего: заставка уйдёт в любом случае

  await loadSave();
  applyLang();
  buildFlags();

  $("playBtn").onclick = () => {
    $("menu").classList.remove("on");
    startLevel(save.level || 1);
  };

  $("splashName").textContent = "HAZNA";
  $("splashTag").textContent = T.sub;
})();
